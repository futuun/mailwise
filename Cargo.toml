[package]
name = "mailwise"
version = "0.1.0"
edition = "2024"
description = "Semantic email search -- runs locally, no data leaves your machine"
license = "MIT"
repository = "https://github.com/futuun/mailwise"
keywords = ["email", "search", "semantic-search", "embeddings", "mbox", "emlx"]
categories = ["command-line-utilities", "text-processing"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mailparse = "0.16"
llama-cpp-2 = { version = "0.1", default-features = false, features = [
  "metal",
] }
rusqlite = { version = "0.39", features = ["bundled"] }
sqlite-vec = "0.1"
libc = "0.2"
zerocopy = "0.8"
rayon = "1"
walkdir = "2"
memmap2 = "0.9"
memchr = "2"
chrono = "0.4"
html-escape = "0.2"
scraper = "0.26"
ego-tree = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dialoguer = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
